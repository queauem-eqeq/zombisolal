  }catch(e){}
}

function overlapSolidX(b){
  const l=b.x-b.w/2,r=b.x+b.w/2,t=b.y-b.h,bt=b.y-.01;
  for(let c=Math.floor(l/TS);c<=Math.floor((r-.01)/TS);c++)for(let rw=Math.floor(t/TS);rw<=Math.floor(bt/TS);rw++)
    if(SOLID(tileAt(c,rw)))return [c,rw];
  return null;
}
function hitCeil(b){const rw=Math.floor((b.y-b.h)/TS);for(let c=Math.floor((b.x-b.w/2)/TS);c<=Math.floor((b.x+b.w/2-.01)/TS);c++)if(SOLID(tileAt(c,rw)))return true;return false}
function body(b,dt,drop){
  b.vy=Math.min(b.vy+880*dt,420);
  // X
  b.x+=b.vx*dt;b.wall=false;
  let h=overlapSolidX(b);
  if(h&&b.step&&b.og){const oy=b.y;b.y-=TS;if(!overlapSolidX(b)&&!hitCeil(b)){b.vy=0;h=null}else b.y=oy}
  if(h){b.wall=true;b.x=b.vx>0?h[0]*TS-b.w/2:(h[0]+1)*TS+b.w/2;b.vx=0}
  // Y
  const pb=b.y;b.y+=b.vy*dt;b.og=false;
  if(b.vy>=0){
    const rw=Math.floor(b.y/TS);
    for(let c=Math.floor((b.x-b.w/2)/TS);c<=Math.floor((b.x+b.w/2-.01)/TS);c++){
      const t=tileAt(c,rw);
      if((SOLID(t)||(ONEWAY(t)&&!drop))&&pb<=rw*TS+.01&&b.y>=rw*TS){b.y=rw*TS;b.vy=0;b.og=true}
    }
  }else{
    const rw=Math.floor((b.y-b.h)/TS);
    for(let c=Math.floor((b.x-b.w/2)/TS);c<=Math.floor((b.x+b.w/2-.01)/TS);c++)
      if(SOLID(tileAt(c,rw))){b.y=(rw+1)*TS+b.h;b.vy=0;break}
  }
}
function groundBelow(x,y){

  return null;
}

function respawn(lose){
  deaths++;
  if(lose){P.hp--;if(P.hp<=0)P.hp=P.max}else P.hp=P.max;
  P.x=cp.x;P.y=groundBelow(cp.x,0)||GY;P.onMP=null;P.climb=false;P.vx=P.vy=P.kx=0;P.inv=1.6;P.atk=0;fade=.6;
  toast('Oups ! On repart du dernier point',2.2);
}
function hurt(fromX,amount=1){
  if(P.inv>0||state!=='play')return;
  P.hp-=amount;P.inv=1.3;shake=.2;S.hurt();
  P.kx=(P.x>=fromX?1:-1)*200;P.vy=-170;P.climb=false;P.og=false;
  spark(P.x,P.y-8,'r2',6);
  if(P.hp<=0)respawn(false);
}
function attack(){
  if(state!=='play'||P.cd>0||!cur)return;
  if(cur==='sword'){P.atk=.3;P.cd=.34;P.hit=new Set();S.swing()}
  else{if(ammo<=0){P.cd=.3;S.click();if(has.sword){cur='sword';toast('Plus de munitions ! Épée',2)}else toast('Plus de munitions !',2);return}ammo--;P.cd=.28;P.atk=.1;S.laser();bolts.push({x:P.x+P.face*8,y:P.y-9,d:P.face,l:1.1})}
}
function switchW(){if(has.sword&&has.laser){cur=cur==='sword'?'laser':'sword';toast(cur==='sword'?'Épée':'Pistolaser',1.2)}}
function killZ(z){
  ZS.splice(ZS.indexOf(z),1);kills++;S.kill();spark(z.x,z.y-10,'zg',8);spark(z.x,z.y-10,'r1',16);spark(z.x,z.y-10,'r2',8);blood(z.x,z.y,z.type==='b'||z.type==='v'?6:4);
  if(Math.random()<(z.type==='b'||z.type==='e'||z.type==='v'?.5:.2))ITEMS.push({kind:'heart',x:z.x,y:z.y-8,ph:0});
  else if(has.laser&&Math.random()<.3)ITEMS.push({kind:'ammo',x:z.x,y:z.y-8,ph:0});
  corpse(z);groan(z.type,.04,true);
}
function corpse(z){
  let gy=groundBelow(z.x,z.y-2);if(gy===null||gy>z.y+48)return;
  CORPSES.push({x:Math.round(z.x),y:gy,dir:z.dir,type:z.type,v:z.v});if(CORPSES.length>60)CORPSES.shift();
}
function killP(g){const i=PGS.indexOf(g);if(i<0)return;PGS.splice(i,1);S.kill();spark(g.x,g.y,'w',6);spark(g.x,g.y,'r1',5);kills++}
function killF(f,score){FISH.splice(FISH.indexOf(f),1);S.kill();spark(f.x,f.y,'w',8);spark(f.x,f.y,'t6',5);if(score)kills++}
function killC(c,splat){
  S.smash();spark(c.x,c.y-4,'zg',6);spark(c.x,c.y-4,'r1',12);spark(c.x,c.y-4,'r2',5);
  if(splat){c.st=3;c.t=0;c.vx=c.vy=0;blood(c.x,c.y,3)}
  else{c.st=4;c.t=0;c.vx*=.3;c.vy=Math.min(c.vy,0)*.3}  // mort en l'air : il tombe au sol
}
function dmgZ(z,n,dir){
  if(z.og)blood(z.x,z.y,1);spark(z.x,z.y-10,'r1',4);z.hp-=n;z.fl=.12;z.kb=z.type==='b'?.08:.2;z.vx=dir*(z.type==='b'?35:90);if(z.og&&z.type!=='b')z.vy=-70;S.hit();spark(z.x,z.y-10,'y',4);
  if(z.hp<=0)killZ(z);
}

/* ---------- mise à jour ---------- */
function update(dt){
  T+=dt;
  for(const t of toasts){t.d-=dt}toasts=toasts.filter(t=>t.d>0);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
  if(shake>0)shake-=dt;if(fade>0)fade-=dt;
  if(state!=='play')return;
  // entrées
  let dx=0;if(keys.l)dx--;if(keys.r)dx++;
  if(P.kx){P.vx=P.kx;P.kx*=.91;if(Math.abs(P.kx)<8)P.kx=0}else P.vx=dx*92;
  if(dx&&!P.kx)P.face=dx;
  if(P.og)P.coy=.1;else P.coy-=dt;
  jumpBuf-=dt;
  // échelle
  {const lc=Math.floor(P.x/TS),onL=r=>tileAt(lc,r)===9||(tileAt(lc,r)===2&&tileAt(lc,r+1)===9);
   if(!P.climb&&!P.kx){
     if(keys.j&&(onL(Math.floor((P.y-4)/TS))||onL(Math.floor((P.y-12)/TS)))&&!(P.og&&tileAt(lc,Math.floor((P.y+2)/TS))===2)){P.climb=true;jumpBuf=0;P.vy=0}
     else if(keys.d&&P.og&&tileAt(lc,Math.floor((P.y+2)/TS))===2&&tileAt(lc,Math.floor((P.y+2)/TS)+1)===9){P.climb=true;P.y+=6;P.drop=.1}
   }
   if(P.climb){
     P.x+=(lc*TS+8-P.x)*Math.min(1,dt*18);P.vx=0;P.vy=0;P.kx=0;
     let cy=0;if(keys.j)cy--;if(keys.d)cy++;jumpBuf=0;
     P.y+=cy*70*dt;P.cly=(P.cly||0)+Math.abs(cy)*dt*70;
     if(P.y<=3*TS+.5&&cy<0){P.y=3*TS;P.climb=false;P.coy=.1;P.vy=0}
     else if(P.y>=GY){P.y=GY;P.climb=false}
     else if(!onL(Math.floor((P.y-4)/TS))&&!onL(Math.floor((P.y+2)/TS))){P.climb=false}
     if(dx&&!P.kx&&!cy){P.climb=false;P.x+=dx*3}
     if(P.climb){P.anim+=cy?dt*8:0;if(P.cd>0)P.cd-=dt;if(P.inv>0)P.inv-=dt;}
   }
  }
  if(!P.climb&&jumpBuf>0&&P.coy>0){
    if(keys.d&&P.og&&(P.onMP||ONEWAY(tileAt(Math.floor(P.x/TS),Math.floor((P.y+1)/TS))))){P.drop=.25;P.y+=2;P.onMP=null}
    else{P.vy=-335;P.coy=0;jumpBuf=0;S.jump()}
  }
  if(!keys.j&&P.vy<-110)P.vy=-110;
  P.drop-=dt;
  for(const m of MPS){m.t+=dt;const f=.5-.5*Math.cos(m.t*6.2832/m.per),nx=m.x0+m.dx*f,ny=m.y0+m.dy*f;m.vx=nx-m.x;m.vy=ny-m.y;m.x=nx;m.y=ny}
  if(P.onMP&&!P.climb){P.x+=P.onMP.vx;P.y=P.onMP.y}
  const pby=P.y;
  if(!P.climb)body(P,dt,P.drop>0);
  P.onMP=null;
  if(!P.climb&&P.vy>=0&&P.drop<=0)for(const m of MPS)if(P.x+P.w/2>m.x+1&&P.x-P.w/2<m.x+m.w-1&&pby<=m.y+2+Math.abs(m.vy)&&P.y>=m.y-.5){P.y=m.y;P.vy=0;P.og=true;P.onMP=m}
  if(P.og)P.anim+=Math.abs(P.vx)>1?dt*10:0;
  if(P.cd>0)P.cd-=dt;if(P.atk>0)P.atk-=dt;if(P.inv>0)P.inv-=dt;
  if(P.y>LH*TS+40)respawn(true);
  // épée
  if(cur==='sword'&&P.atk>.07&&P.atk<.23){
    const hb={x:P.x+P.face*11,y:P.y,w:22,h:18};
    for(const z of ZS.slice())if(!P.hit.has(z)&&rectHit(hb,z)){P.hit.add(z);dmgZ(z,2,P.face)}
    for(const g of PGS.slice())if(g.st>=0&&g.st<3&&!P.hit.has(g)&&rectHit(hb,{x:g.x,y:g.y+4,w:10,h:8})){P.hit.add(g);killP(g)}
    for(const f of FISH.slice())if(f.st===2&&!P.hit.has(f)&&rectHit(hb,{x:f.x,y:f.y+5,w:12,h:12})){P.hit.add(f);killF(f,true)}
    for(const c of CATS)if(c.st===2&&!P.hit.has(c)&&rectHit(hb,{x:c.x,y:c.y,w:10,h:8})){P.hit.add(c);killC(c,true);kills++}
  }
  // pics
  {const c0=Math.floor((P.x-P.w/2)/TS),c1=Math.floor((P.x+P.w/2-.01)/TS);
   for(let c=c0;c<=c1;c++)if(tileAt(c,9)===3&&P.y>9*TS+6)hurt(c*TS+8)}
  // tirs
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];b.x+=b.d*250*dt;b.l-=dt;let del=b.l<=0;
    if(SOLID(tileAt(Math.floor(b.x/TS),Math.floor(b.y/TS)))){del=true;spark(b.x,b.y,'c',4)}
    for(const z of ZS.slice())if(!del&&Math.abs(z.x-b.x)<z.w/2+2&&b.y>z.y-z.h&&b.y<z.y){dmgZ(z,4,b.d);del=true}
    for(const g of PGS.slice())if(!del&&g.st>=0&&g.st<3&&Math.abs(g.x-b.x)<7&&Math.abs(g.y-b.y)<6){killP(g);del=true}
    for(const f of FISH.slice())if(!del&&f.st===2&&Math.abs(f.x-b.x)<7&&Math.abs(f.y+5-b.y)<8){killF(f,true);del=true}
    for(const c of CATS)if(!del&&c.st===2&&Math.abs(c.x-b.x)<7&&Math.abs(c.y-4-b.y)<6){killC(c,true);kills++;del=true}
    if(del)bolts.splice(i,1);
  }
  // zombies
  for(const z of ZS.slice()){
    if(Math.abs(P.x-z.x)>420&&z.og)continue; // hors champ : en attente
    z.t+=dt;if(z.fl>0)z.fl-=dt;
    const ddx=P.x-z.x,ddy=P.y-z.y,chase=z.kb<=0&&Math.abs(ddx)<z.rng&&Math.abs(ddy)<30;
    // grognements
    if(Math.abs(ddx)<230){z.gr-=dt;if(z.gr<=0){z.gr=4+Math.random()*6;if(groanCd<=0){groan(z.type,.035*(1-Math.abs(ddx)/260));groanCd=.5}}}
    // vomisseur : crache en cloche
    if(z.type==='v'){
      if(z.wind>0){z.wind-=dt;if(z.wind<=0){
        const sx=z.x+z.dir*5,sy=z.y-19,tx=P.x+(Math.random()-.5)*30,ty=P.y,g=450,tt=.7+Math.abs(tx-sx)/260;
        SPIT.push({x:sx,y:sy,vx:(tx-sx)/tt,vy:(ty-sy-.5*g*tt*tt)/tt,ty,t:0});S.spit();z.sp=2.4+Math.random()*1.4}
      }else{
        z.sp-=dt;
        if(z.sp<=0&&Math.abs(ddx)<175&&Math.abs(ddx)>28&&Math.abs(ddy)<100&&z.kb<=0){z.wind=.6;z.dir=ddx>0?1:-1}
      }
    }
    if(z.kb>0){z.kb-=dt}
    else{
      if(chase)z.dir=ddx>0?1:-1;
      if(z.zone){if(z.x<z.zone[0])z.dir=1;else if(z.x>z.zone[1])z.dir=-1}
      let sp=chase?z.chase:z.spd;
      if(z.wind>0)sp=0;
      if(z.og){
        const ax=z.x+z.dir*(z.w/2+3);
        if(!hasFloorBelow(ax,z.y,34)){if(chase)sp=0;else z.dir*=-1}
      }
      if(z.wall){if(chase&&z.jmp){if(z.og)z.vy=-z.jv}else z.dir*=-1}
      z.vx=z.dir*sp;
    }
    body(z,dt,false);
    if(z.kb>0)z.vx*=.9;
    if(z.y>LH*TS+60)ZS.splice(ZS.indexOf(z),1);
    else if(rectHit(P,z)){
      if(P.inv<=0&&!P.climb){hurt(z.x,z.dmg);z.kb=.3;z.vx=(z.x>=P.x?1:-1)*130}
      else z.x+=(z.x>=P.x?1:-1)*120*dt;
    }
  }
  for(let i=0;i<ZS.length;i++)for(let j=i+1;j<ZS.length;j++){const a=ZS[i],b=ZS[j];
    if(Math.abs(a.y-b.y)>10)continue;const d=b.x-a.x,ov=(a.w+b.w)/2+2-Math.abs(d);
    if(ov>0){const p=Math.min(ov/2,45*dt),sg=d>=0?1:-1;a.x-=sg*p;b.x+=sg*p;if(overlapSolidX(a))a.x+=sg*p;if(overlapSolidX(b))b.x-=sg*p}}
  groanCd-=dt;
  // crachats
  for(const s of SPIT.slice()){
    s.t+=dt;s.vy+=450*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    let hit=false,py=s.y;
    if(Math.abs(P.x-s.x)<7&&P.y-16<s.y+2&&P.y>s.y-2){hurt(s.x,1);hit=true}
    const tl=tileAt(Math.floor(s.x/TS),Math.floor(s.y/TS));
    if(tl!==0&&s.vy>0){hit=true;py=Math.floor(s.y/TS)*TS}
    else if(s.vy>0&&s.y>=s.ty){hit=true;py=s.y}
    if(s.y>LH*TS+10||s.x<-10||s.x>LW*TS+10){SPIT.splice(SPIT.indexOf(s),1);continue}
    if(hit){SPIT.splice(SPIT.indexOf(s),1);S.splat();spark(s.x,py,'zg',6);spark(s.x,py,'zd',4);
      if(hasFloor(s.x,py+2)||tl!==0)PUD.push({x:Math.round(s.x),y:Math.round(py),t:3})}
  }
  for(const p of PUD.slice()){p.t-=dt;if(p.t<=0){PUD.splice(PUD.indexOf(p),1);continue}
    if(Math.abs(P.x-p.x)<9&&P.y>p.y-2&&P.y-8<p.y)hurt(p.x,1)}
  // chats postés sur les toits du décor
  {CX=Math.round(cam);const off=Math.round(CX*MID.f),BW=MID.BW;
   for(let i=Math.floor(off/BW)-1;i<=Math.floor((off+VW)/BW)+1;i++){
    const ox=catSpot(i);if(ox===null)continue;
    const sx=i*BW-off+ox,top=midTop(i);
    if(CBST[i]===undefined){if(Math.abs(sx-(P.x-CX))<8&&P.x>380&&P.y>top+12&&sx>4&&sx<VW-4){CBST[i]=.45;S.warn()}}
    else{CBST[i]-=dt;if(CBST[i]<=0){
      delete CBST[i];CATUSED.add(i);
      const cx=sx+CX,cy=top,ty=P.y-8,g=700,vy0=-70,dsc=vy0*vy0+2*g*(ty-cy),tt=dsc>0?(-vy0+Math.sqrt(dsc))/g:.6;
      const vx=Math.max(-170,Math.min(170,(P.x-cx)/Math.max(.25,tt)));
      CATS.push({x:cx,y:cy,by:cy,vx,vy:vy0,st:2,t:0,dir:vx<0?-1:1,tx:cx+vx*tt,gy:P.y});S.jump();
    }}
   }}
  // chats zombies (sautent depuis les toits)
  for(const c of CATS.slice()){
    c.t+=dt;
    if(c.st===1){
      if(c.t>.5){
        const ty=P.y-8,g=700,vy0=-70,disc=vy0*vy0+2*g*(ty-c.y),tt=disc>0?(-vy0+Math.sqrt(disc))/g:.6;
        c.vx=Math.max(-170,Math.min(170,(P.x-c.x)/Math.max(.25,tt)));c.vy=vy0;c.dir=c.vx<0?-1:1;c.st=2;S.jump();
      }
    }else if(c.st===4){
      c.vy+=700*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
      if(c.vy>0&&tileAt(Math.floor(c.x/TS),Math.floor(c.y/TS))!==0){c.y=Math.floor(c.y/TS)*TS;c.st=3;c.vx=c.vy=0;S.splat();blood(c.x,c.y,3)}
      else if(c.y>LH*TS+20)CATS.splice(CATS.indexOf(c),1);
    }else if(c.st===2){
      c.vy+=700*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
      if(rectHit(P,{x:c.x,y:c.y,w:10,h:8})){hurt(c.x,1);killC(c,false);continue}
      if(c.vy<0&&!c.m){c.m=1;S.meow()}
      if(c.vy>0&&tileAt(Math.floor(c.x/TS),Math.floor(c.y/TS))!==0){c.y=Math.floor(c.y/TS)*TS;killC(c,true)}
      else if(c.y>LH*TS+20)CATS.splice(CATS.indexOf(c),1);
    }
  }
  // poissons squelettes
  for(const f of FISH.slice()){
    if(f.st===0){f.t-=dt;if(f.t<=0&&P.y<=DY+4&&P.x>BR0*TS-40&&P.x<(BR1+1)*TS+40&&Math.abs(P.x-f.x)<115){f.st=1;f.t=1.5}}
    else if(f.st===1){f.t-=dt;if(f.t<=0){
      const g=520,y0=176,ay=Math.max(30,P.y-80),vy0=-Math.sqrt(2*g*(y0-ay)),tp=-vy0/g;
      f.y=y0;f.vy=vy0;f.vx=Math.max(-130,Math.min(130,(P.x-f.x)/tp));f.dir=f.vx<0?-1:1;f.st=2;S.jump();spark(f.x,168,'c',5)}}
    else if(f.st===2){
      f.vy+=520*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
      if(rectHit(P,{x:f.x,y:f.y+5,w:10,h:12})){hurt(f.x,1);killF(f,false);continue}
      if(f.vy>0&&f.y>=176){f.st=0;f.t=2+Math.random()*3;f.y=176;f.x=f.x0;spark(f.x,168,'c',5)}
    }
  }
  // pigeons zombies
  for(const g of PGS.slice()){
    g.t+=dt;
    if(g.st===-1){
      if(Math.abs(P.x-g.x)<110&&PGS.filter(q=>q.st>=0&&q.st<3).length<2){const side=Math.random()<.5?-1:1;g.x=P.x+side*190;g.y=Math.max(10,P.y-100);g.st=0;g.t=0;g.atk=1+Math.random()*4;g.ph=Math.random()*6;g.dir=-side}
    }else if(g.st===0){
      const tx=P.x+Math.sin(g.t*1.4+g.ph)*70,ty=Math.max(10,P.y-80+Math.sin(g.t*3)*7),ox=g.x;
      g.x+=(tx-g.x)*Math.min(1,dt*2.2);g.y+=(ty-g.y)*Math.min(1,dt*3);
      if(Math.abs(g.x-ox)>.15)g.dir=g.x>ox?1:-1;
      if(g.t>g.atk){const px=P.x+P.vx*.2,py=P.y-8,d=Math.hypot(px-g.x,py-g.y)||1;g.vx=(px-g.x)/d*190;g.vy=(py-g.y)/d*190;g.dir=g.vx<0?-1:1;g.st=2}
    }else if(g.st===2){
      g.x+=g.vx*dt;g.y+=g.vy*dt;
      if(rectHit(P,{x:g.x,y:g.y+4,w:10,h:8})){hurt(g.x,1);PGS.splice(PGS.indexOf(g),1);spark(g.x,g.y,'w',8);continue}
      const t=tileAt(Math.floor(g.x/TS),Math.floor((g.y+4)/TS));
      if(SOLID(t)||ONEWAY(t)){g.st=3;g.t=0;g.vx=g.vy=0;g.y=Math.floor((g.y+4)/TS)*TS-3;S.smash();shake=.1;spark(g.x,g.y,'w',6);spark(g.x,g.y,'r1',10);blood(g.x,g.y+3,3)}
      else if(g.y>LH*TS||g.x<-20||g.x>LW*TS+20)PGS.splice(PGS.indexOf(g),1);
    }
  }
  // pièges
  for(const o of OBJ){
    if(o.st===0){
      const trig=o.sky?36:22;
      if(Math.abs(P.x-o.x)<trig&&(o.sky||P.y>o.y)&&Math.abs(P.x-o.x)<trig){o.st=1;o.t=o.sky?.8:.5;S.warn()}
    }else if(o.st===1){
      o.t-=dt;if(Math.floor(o.t*20)%4===0&&o.t>0.05&&Math.random()<.2)S.warn();
      if(o.t<=0){o.st=2;o.vy=0}
    }else if(o.st===2){
      o.vy=Math.min(o.vy+700*dt,380);o.y+=o.vy*dt;
      const box={x:o.x,y:o.y,w:o.w,h:o.h};
      if(rectHit(P,box))hurt(o.x);
      for(const z of ZS.slice())if(rectHit(z,box))dmgZ(z,3,0);
      const g=groundBelow(o.x,o.y-o.h);
      if(g!==null&&o.y>=g){o.st=3;S.smash();shake=.12;spark(o.x,g-3,'t6',8);if(o.kind==='pot')spark(o.x,g-3,'r1',8)}
      else if(o.y>LH*TS+40)o.st=3;
    }
  }
  // objets
  for(let i=ITEMS.length-1;i>=0;i--){
    const it=ITEMS[i];it.ph+=dt;
    if(Math.abs(P.x-it.x)<11&&Math.abs((P.y-8)-it.y)<14&&(it.kind!=='ammo'||has.laser)){
      if(it.kind==='heart'){if(P.hp<P.max){P.hp++;S.heart();ITEMS.splice(i,1)}}
      else if(it.kind==='sword'){has.sword=true;cur='sword';S.item();toast('Tu as trouvé une ÉPÉE !  Touche X pour frapper',4);ITEMS.splice(i,1)}
      else if(it.kind==='laser'){has.laser=true;cur='laser';ammo+=10;S.item();toast('PISTOLASER : 10 BALLES, 2 FOIS PLUS FORT QUE L\'ÉPÉE !',5);ITEMS.splice(i,1)}
      else if(it.kind==='ammo'){ammo+=5;S.item();toast('MUNITIONS +5',1.8);if(has.laser&&cur==='sword'&&ammo===5)cur='laser';ITEMS.splice(i,1)}

function blade(hx,hy,ang,len){
  const cx=Math.cos(ang),sy=Math.sin(ang),tx=hx+cx*len,ty=hy+sy*len,steep=Math.abs(sy)>Math.abs(cx);
  line(hx,hy,tx,ty,'w');line(hx+(steep?1:0),hy+(steep?0:1),tx+(steep?1:0),ty+(steep?0:1),'t6');

}

/* ---------- reset / entrées ---------- */
function reset(){
  location.reload();
}
function begin(){state='play';tstart=T;snd(440,.1,'triangle',.07);toast(TOUCH?'< > : COURIR · ^ : SAUTER (MAINTENU : GRIMPER)':'< > : COURIR · ^ OU ESPACE : SAUTER',4);goFS()}
const K={ArrowLeft:'l',q:'l',a:'l',ArrowRight:'r',d2:'r',ArrowUp:'j',z:'j',w:'j',' ':'j',ArrowDown:'d',s:'d'};
function kd(e){
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(state==='title'){begin();return}
  if(state==='win'){if(T-tend>1)reset();return}
  if(k==='ArrowLeft'||k==='q'||k==='a')keys.l=true;
  else if(k==='ArrowRight'||k==='d'){keys.r=true;if(k==='d')keys.d=false}
  else if(k==='ArrowUp'||k==='z'||k==='w'||k===' '){if(!keys.j)jumpBuf=.12;keys.j=true;if(k!==' ')keys.u=true;else keys.sp=true}
  else if(k==='ArrowDown'||k==='s')keys.d=true;
  else if(k==='x'||k==='k'||k==='Enter'){if(!e.repeat)attack()}
  else if(k==='c'||k==='v'){switchW()}
}
function ku(e){
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='ArrowLeft'||k==='q'||k==='a')keys.l=false;
  else if(k==='ArrowRight'||k==='d')keys.r=false;
  else if(k==='ArrowUp'||k==='z'||k==='w'||k===' '){keys.j=false;if(k!==' ')keys.u=false;else keys.sp=false}
  else if(k==='ArrowDown'||k==='s')keys.d=false;
}
addEventListener('keydown',kd);addEventListener('keyup',ku);
addEventListener('blur',()=>{keys.l=keys.r=keys.j=keys.d=keys.u=keys.sp=false});
cv.addEventListener('pointerdown',()=>{if(state==='title')begin();else if(state==='win'&&T-tend>1)reset()});
// tactile
const pad=document.getElementById('pad');
if(TOUCH){pad.style.display='block';document.body.classList.add('touch')}
function goFS(){if(!TOUCH)return;const el=document.documentElement;try{const p=(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}catch(e){}}
document.getElementById('fs').addEventListener('click',()=>{const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{try{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}}});
addEventListener('fullscreenchange',()=>setTimeout(fit,50));
function bind(id,down,up){const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('on');if(state==='title'){begin();return}if(state==='win'){if(T-tend>1)reset();return}down()});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();b.classList.remove('on');if(up)up()});
  b.addEventListener('contextmenu',e=>e.preventDefault())}
bind('lf',()=>keys.l=true,()=>keys.l=false);
bind('rt',()=>keys.r=true,()=>keys.r=false);
bind('jp',()=>{keys.j=true;jumpBuf=.12},()=>keys.j=false);
bind('dn',()=>keys.d=true,()=>keys.d=false);

/* ---------- boucle ---------- */
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(.1,(now-last)/1000);last=now;
  while(acc>=1/60){update(1/60);acc-=1/60}
  draw();requestAnimationFrame(loop);
}
window.__g={FISH,SPIT,PUD,CORPSES,CATS,BL,PGS,P,ZS,OBJ,ITEMS,CPS,tiles,get state(){return state},get cur(){return cur},get kills(){return kills},get deaths(){return deaths},update,draw,kd,ku,begin,GOAL,TS,has,get cam(){return cam}};
P.y=GY;cam=0;
requestAnimationFrame(loop);
})();
